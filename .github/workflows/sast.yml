name: SAST Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Semgrep SAST Scan
        run: |
          docker run --rm -v ${{ github.workspace }}:/src semgrep/semgrep semgrep ci --sarif --config /src/sast-semgrep/rules/ > semgrep.json || true
      
      - name: Check for findings
        run: |
          FINDINGS=$(jq '.runs[0].results | length' semgrep.json 2>/dev/null || echo "0")
          if [ "$FINDINGS" -gt 0 ]; then
            echo "SAST найдено $FINDINGS уязвимостей. Пайплайн остановлен."
            exit 1
          else
            echo "Уязвимостей не найдено"
          fi
      
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.json

  gitleaks:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  dependency-check:
    name: OWASP Dependency Check (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: 'vulnerable-python-app'
          path: '.'
          format: 'SARIF'
          out: 'depcheck-report.json'
      
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: depcheck-report.json
      
      - name: Check for vulnerabilities
        run: |
          VULNS=$(jq '.runs[0].results | length' depcheck-report.json 2>/dev/null || echo "0")
          if [ "$VULNS" -gt 0 ]; then
            echo "SCA найдено $VULNS уязвимостей в зависимостях"
            exit 1
          else
            echo "Уязвимостей в зависимостях не найдено"
          fi

  merge-and-jira:
    name: Merge reports & Jira mock
    runs-on: ubuntu-latest
    needs: [semgrep-sast, gitleaks, dependency-check]
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Semgrep report
        uses: actions/download-artifact@v4
        with:
          name: semgrep.json
          path: .
        continue-on-error: true
      
      - name: Download Gitleaks report
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: .
        continue-on-error: true
      
      - name: Download Dependency Check report
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report.sarif
          path: .
        continue-on-error: true
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Rename reports to expected names
        run: |
          [ -f gitleaks-results.sarif ] && cp gitleaks-results.sarif gitleaks-report.json || true
          [ -f dependency-check-report.sarif ] && cp dependency-check-report.sarif depcheck-report.json || true
          [ -f semgrep.json ] || echo '{"results":[]}' > semgrep.json
      
      - name: Merge reports and filter false positives
        run: |
          python scripts/merge_reports.py
      
      - name: Create Jira tickets (mock)
        run: |
          python scripts/jira_mock.py --input filtered-issues.json --no-dry-run
      
      - name: Upload all security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            merged-report.json
            filtered-issues.json
            reports/
            *.json
            *.sarif
      
      - name: Show filtered issues summary
        run: |
          if [ -f filtered-issues.json ]; then
            echo "=== FILTERED ISSUES SUMMARY ==="
            cat filtered-issues.json | jq '.total_critical_findings'
            echo "================================"
          fi
