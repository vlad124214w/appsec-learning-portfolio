name: SAST Security Scan

on:
  push:
    branches: [ main, feature/*, '*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Semgrep JSON
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
            --config p/java --config p/owasp-top-ten --config p/secrets \
            --json --output /src/semgrep.json \
            /src/vulnado --exclude target || true
          test -f semgrep.json || echo '{"results":[]}' > semgrep.json
      - name: Semgrep SARIF (optional)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
            --config p/java --config p/owasp-top-ten \
            --sarif --output /src/semgrep.sarif \
            /src/vulnado --exclude target || true
          test -f semgrep.sarif || echo '{"runs":[{"results":[]}]}' > semgrep.sarif     
      # - name: Semgrep SAST Scan
      #   run: |
      #     docker run --rm -v ${{ github.workspace }}:/src semgrep/semgrep semgrep scan --sarif --config p/owasp-top-ten --config p/java --config p/secrets /src/vulnado/ --exclude '.github' --exclude 'scripts' > semgrep.sarif || true
          
      #     if [ -s semgrep.sarif ]; then
      #       echo "Semgrep report saved"
      #       echo "Findings count: $(jq '.runs[0].results | length' semgrep.sarif || echo '0')"
      #     else
      #       echo '{"runs": [{"results": []}]}' > semgrep.sarif
      #       echo "Empty report created"
      #     fi
      
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json
          path: semgrep.json
          if-no-files-found: warn
      
      # - name: Upload SARIF report
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: semgrep.json

  gitleaks:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks
        run: |
          gitleaks detect --source vulnado --report-path gitleaks-report.json \
            --report-format json --no-git --exit-code 0 || true
          test -f gitleaks-report.json || echo '[]' > gitleaks-report.json
      # - name: Run Gitleaks on vulnado
      #   run: |
      #     docker run --rm -v "${{ github.workspace }}:/repo" zricethe/gitleaks:latest detect \
      #       --source /repo/vulnado \
      #       --report-path /repo/gitleaks-report.json \
      #       --report-format json \
      #       --no-git \
      #       --exit-code 0
      #     echo "Gitleaks findings: $(jq 'length' gitleaks-report.json 2>/dev/null || echo 0)"
      - name: Upload Gitleaks artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-json
          path: gitleaks-report.json
          if-no-files-found: warn

  # gitleaks:
  #   name: Gitleaks secrets scan
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #     - uses: gitleaks/gitleaks-action@v2
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  dependency-check:
    name: OWASP Dependency Check (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        with:
          project: 'vulnado'
          path: 'vulnado'
          format: 'SARIF'
          out: 'reports' 

      - name: Fix reports permissions
        run: sudo chown -R "$USER:$USER" reports
      
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: reports/dependency-check-report.sarif

      # - run: test -f reports/dependency-check-report.sarif || mkdir -p reports && echo '{"runs":[{"results":[]}]}' > reports/dependency-check-report.sarif

      - name: Upload Dependency Check SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: depcheck-sarif
          path: reports/dependency-check-report.sarif
          if-no-files-found: warn
      
      - name: Show SCA summary
        run: |
          jq '.runs[0].results | length' reports/dependency-check-report.sarif
        continue-on-error: true
      # Проверка на уязвимости 
