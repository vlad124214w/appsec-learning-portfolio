      #       else
      #         echo "Уязвимостей в зависимостях не найдено"
      #       fi
      #     else
      #       echo "тчет не найден"
      #     fi

  dast-zap:
    name: DAST OWASP ZAP (Vulnado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Vulnado
        working-directory: vulnado
        run: docker compose up -d --build
      - name: Wait for Vulnado
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/cowsay?input=ping >/dev/null 2>&1; then
              echo "Vulnado API ready"
              exit 0
            fi
            echo "Waiting... ($i/40)"
            sleep 5
          done
          docker compose -f vulnado/docker-compose.yml logs
          exit 1
      - name: Run ZAP baseline on Vulnado
        run: |
          docker run --rm --network host -v "${{ github.workspace }}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 \
            -J /zap/wrk/zap.json -r /zap/wrk/zap.html || true
          test -s zap.json || echo '{"site":[]}' > zap.json
          test -f zap.html || echo "<html></html>" > zap.html
      - name: Stop Vulnado
        if: always()
        working-directory: vulnado
        run: docker compose down -v
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: |
            zap.json
            zap.html

