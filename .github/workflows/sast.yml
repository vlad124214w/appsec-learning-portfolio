name: SAST Security Scan

on:
  push:
    branches: [ main, feature/*, '*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Semgrep JSON
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
            --config p/java --config p/owasp-top-ten --config p/secrets \
            --json --output /src/semgrep.json \
            /src/vulnado --exclude target || true
          test -f semgrep.json || echo '{"results":[]}' > semgrep.json
      - name: Semgrep SARIF (optional)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
            --config p/java --config p/owasp-top-ten \
            --sarif --output /src/semgrep.sarif \
            /src/vulnado --exclude target || true
          test -f semgrep.sarif || echo '{"runs":[{"results":[]}]}' > semgrep.sarif     
      
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json
          path: semgrep.json
          if-no-files-found: warn

  gitleaks:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks
        run: |
          gitleaks detect --source vulnado --report-path gitleaks-report.json \
            --report-format json --no-git --exit-code 0 || true
          test -f gitleaks-report.json || echo '[]' > gitleaks-report.json

      - name: Upload Gitleaks artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-json
          path: gitleaks-report.json
          if-no-files-found: warn

  dependency-check:
    name: OWASP Dependency Check (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        with:
          project: 'vulnado'
          path: 'vulnado'
          format: 'SARIF'
          out: 'reports' 

      - name: Fix reports permissions
        run: sudo chown -R "$USER:$USER" reports
      
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: reports/dependency-check-report.sarif


      - name: Upload Dependency Check SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: depcheck-sarif
          path: reports/dependency-check-report.sarif
          if-no-files-found: warn
      
      - name: Show SCA summary
        run: |
          jq '.runs[0].results | length' reports/dependency-check-report.sarif
        continue-on-error: true

  dast-zap:
    name: DAST OWASP ZAP (Vulnado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Start PostgreSQL
        run: |
          docker run -d --name vulnado-db \
            -e POSTGRES_PASSWORD=vulnado \
            -e POSTGRES_DB=vulnado \
            -p 5432:5432 \
            postgres:15-alpine
          for i in $(seq 1 30); do
            docker exec vulnado-db pg_isready -U postgres && exit 0
            sleep 2
          done
          exit 1
      - name: Start Vulnado (Maven)
        working-directory: vulnado
        env:
          PGHOST: localhost:5432
          PGDATABASE: vulnado
          PGUSER: postgres
          PGPASSWORD: vulnado
        run: |
          mvn -B -q -DskipTests spring-boot:run &
          echo $! > ../vulnado.pid
      - name: Wait for Vulnado
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8080/cowsay?input=ping" >/dev/null; then
              echo "Vulnado ready"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          exit 1
      - name: Run ZAP baseline on Vulnado
        run: |
          docker run --rm --network host -v "${{ github.workspace }}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 \
            -J /zap/wrk/zap.json -r /zap/wrk/zap.html || true
          test -s zap.json || echo '{"site":[]}' > zap.json
          test -f zap.html || echo "<html></html>" > zap.html
      - name: Stop services
        if: always()
        run: |
          kill "$(cat vulnado.pid)" 2>/dev/null || true
          docker rm -f vulnado-db || true
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: |
            zap.json
            zap.html

  merge-and-jira:
    name: Merge reports & Jira mock
    runs-on: ubuntu-latest
    needs: [semgrep-sast, gitleaks, dependency-check]
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Semgrep report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-json
          path: .
        continue-on-error: true
      - name: Download Gitleaks report
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-json
          path: .
        continue-on-error: true
      - name: Download Dependency Check report
        uses: actions/download-artifact@v4
        with:
          name: depcheck-sarif
          path: reports
        continue-on-error: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install requests
      - name: Create empty reports if missing
        run: |
          test -f semgrep.json || echo '{"results":[]}' > semgrep.json
          test -f gitleaks-report.json || echo '[]' > gitleaks-report.json
          test -f reports/dependency-check-report.sarif || mkdir -p reports && echo '{"runs":[{"results":[]}]}' > reports/dependency-check-report.sarif
          cp reports/dependency-check-report.sarif depcheck-report.json
      - name: Run merge_reports.py
        run: python scripts/merge_reports.py
      
      - name: Run merge_reports.py
        run: python scripts/merge_reports.py
      
      - name: Run jira_mock.py
        run: python scripts/jira_mock.py --input filtered-issues.json --no-dry-run
      
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            merged-report.json
            filtered-issues.json
            reports/