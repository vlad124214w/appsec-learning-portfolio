      #       VULNS=$(jq '.runs[0].results | length' reports/dependency-check-report.sarif 2>/dev/null || echo "0")
      #       if [ "$VULNS" -gt 0 ]; then
      #         echo "SCA найдено $VULNS уязвимостей в зависимостях"
