  merge-and-jira:
    name: Merge reports & Jira mock
    runs-on: ubuntu-latest
    needs: [semgrep-sast, gitleaks, dependency-check]
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Semgrep report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-json
          path: .
        continue-on-error: true
      - name: Download Gitleaks report
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-json
          path: .
        continue-on-error: true
      - name: Download Dependency Check report
        uses: actions/download-artifact@v4
        with:
          name: depcheck-sarif
          path: reports
        continue-on-error: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install requests
      - name: Create empty reports if missing
        run: |
          test -f semgrep.json || echo '{"results":[]}' > semgrep.json
          test -f gitleaks-report.json || echo '[]' > gitleaks-report.json
          test -f reports/dependency-check-report.sarif || mkdir -p reports && echo '{"runs":[{"results":[]}]}' > reports/dependency-check-report.sarif
          cp reports/dependency-check-report.sarif depcheck-report.json
      - name: Run merge_reports.py
        run: python scripts/merge_reports.py
      
      - name: Run merge_reports.py
        run: python scripts/merge_reports.py
      
      - name: Run jira_mock.py
        run: python scripts/jira_mock.py --input filtered-issues.json --no-dry-run
      
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            merged-report.json
            filtered-issues.json
            reports/